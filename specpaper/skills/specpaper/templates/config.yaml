# SpecPaper project configuration
# Generated by: specpaper init / bootstrap.sh
# Lives at: .specpaper/config.yaml
version: 1

project:
  name: ""
  description: ""
  repo: ""

# Issue tracker abstraction. Drives tracker-sync.sh dispatch.
tracker:
  kind: "none"                     # "github" | "azure-devops" | "none"
  github:
    repo: ""                       # owner/repo (auto-detected from git remote if empty)
    token_secret: "github_token"   # secret name in Paperclip Settings → Secrets
    label: "specpaper"
  azure_devops:
    organization: ""               # https://dev.azure.com/<org>
    project: ""                    # AzDo project name (auto-detected from git remote if empty)
    work_item_type: "User Story"
    area_path: ""                  # optional
    iteration_path: ""             # optional
    pat_secret: "azure_devops_pat" # secret name

# Build routing — glob → agent. parse-tasks.sh consults these when a task omits Agent:.
routing:
  rules:
    - match: "**/*.{cs,csproj,sln,Directory.Build.props}"
      agent: "builder-dotnet"
    - match: "**/{appsettings,launchSettings}*.json"
      agent: "builder-dotnet"
    - match: "apps/web/**/*.{ts,tsx,js,jsx,css}"
      agent: "builder-nextjs"
    - match: "**/{next.config.*,tailwind.config.*,postcss.config.*}"
      agent: "builder-nextjs"
    - match: "**/*.bicep"
      agent: "devops"
    - match: "**/*.tf"
      agent: "devops"
    - match: "infra/**/*"
      agent: "devops"
    - match: "**/Dockerfile"
      agent: "devops"
    - match: "**/{docker-compose,compose}*.{yml,yaml}"
      agent: "devops"
    - match: ".github/workflows/**/*.{yml,yaml}"
      agent: "devops"
    - match: "azure-pipelines*.{yml,yaml}"
      agent: "devops"
    - match: "**/{k8s,kubernetes,helm,charts}/**/*"
      agent: "devops"
    - match: "**/Caddyfile"
      agent: "devops"
    - match: "db/migrations/**/*.sql"
      agent: "builder"
    - match: "**/*"
      agent: "builder"

# Quality gates run by builders before committing
tooling:
  format_command: ""               # e.g. "dotnet format" / "pnpm lint --fix"
  lint_command: ""
  test_command: ""
  build_command: ""

# Git strategy
git:
  strategy: "branch-per-change"    # "branch-per-change" | "direct" | "worktree-per-change"
  auto_commit: true
  commit_prefix: "specpaper"
  branch_prefix: "specpaper/"
  worktree_dir: ".specpaper/worktrees"

# Build orchestration
build:
  parallel_tasks: 3                # Max concurrent Paperclip child issues per wave
  timeout_seconds: 300

# In-repo docs (mirrors human-readable artifacts)
docs:
  enabled: true                    # always on for SpecPaper; do not disable without a strong reason
  path: "docs/changes"
  index: true                      # auto-generate docs/changes/index.md

# Workflow enforcement
workflow:
  strict: true                     # Enforce phase prerequisites (disable for rapid prototyping)

# Automation
automation:
  auto_mode: false
  cron: ""
  max_tasks_per_run: 5
  auto_verify: true                # Trigger verifier + e2e-tester after build
  auto_archive: false              # Archive on successful audits
  post_build_review: true
