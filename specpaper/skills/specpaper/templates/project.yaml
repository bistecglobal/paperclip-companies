# Generated by: bootstrap.sh
# Lives at: .specpaper/project.yaml
project:
  id: ""                           # Paperclip projectId (UUID)
  slug: ""                         # short-name used for branches, channels, paths
  name: ""                         # human-friendly name
  repo:
    url: ""
    default_branch: "main"
  tracker:
    kind: "none"                   # "github" | "azure-devops" | "none" — derived from repo URL
    organization: ""               # AzDo org URL or GH owner
    project: ""                    # AzDo project name (or repo name for GH)
  context:
    customer_tier: "internal"      # "enterprise" | "smb" | "internal"
    compliance: []                 # e.g. ["sox", "hipaa", "gdpr"]
    deployment_target: ""          # "azure" | "hetzner" — set by CTO during plan based on principles
  status: "active"                 # "active" | "paused" | "archived"
  created_at: ""                   # ISO 8601 (auto-filled by bootstrap.sh)
